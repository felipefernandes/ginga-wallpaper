[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ginga-wallpaper"
version = "1.0.1"
description = "Lightweight animated wallpaper for Windows 11 with multi-monitor alignment."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "glfw>=2.7",
    "moderngl>=5.10",
    "numpy>=1.26",
    "tomli-w>=1.0",
    "pystray>=0.19; sys_platform == 'win32'",
    "soundcard>=0.4.6; sys_platform == 'win32'",
    "pillow>=10",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
build = ["pyinstaller>=6.10"]

[project.scripts]
ginga = "ginga.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"ginga.shaders" = ["*.glsl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
